[project]
name = "cairn-api"
version = "0.1.0"
description = "Cairn API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "feedparser>=6.0.11",
  "requests>=2.32,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "aiohttp>=3.10,<4.0",
  "lxml>=5.3,<6.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
