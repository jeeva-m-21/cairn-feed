[project]
name = "cairn-api"
version = "0.1.0"
description = "Cairn API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "psycopg2-binary>=2.9,<3.0",
  "pydantic[email]>=2.9,<3.0",
  "feedparser>=6.0.11",
  "requests>=2.32,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "aiohttp>=3.10,<4.0",
  "lxml>=5.3,<6.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "src.cairn_api.main:app"
